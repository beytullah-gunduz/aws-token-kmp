kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

#Android
android.useAndroidX=true
android.enableJetifier=false

# AGP 9+ refuses the classic com.android.library + kotlin-multiplatform combo
# by default. These two flags bypass the guard so we can keep using
# com.android.library (which Compose Multiplatform Resources supports cleanly,
# unlike com.android.kotlin.multiplatform.library).
android.builtInKotlin=false
android.newDsl=false

#MPP
kotlin.mpp.enableCInteropCommonization=true

# Local-dev placeholder for the app version. The release workflow overrides
# this with the git tag via `-Papp.version=<tag>`. Must be plain MAJOR.MINOR.PATCH
# AND have MAJOR >= 1, because there are TWO layers of validation that
# disagree on `0.0.0`:
#   1. Compose Desktop's plugin validates the format at *configuration time*
#      (every Gradle task — even `spotlessCheck`/`properties`). It accepts
#      `0.0.0` but rejects suffixes (`0.0.0-dev` → `Illegal version for 'Msi'`).
#   2. `jpackage` itself validates at *packaging time*. On macOS it rejects
#      `MAJOR=0` for `.dmg` per Apple's `CFBundleShortVersionString` rules,
#      so `0.0.0` would silently break local `packageReleaseDmg` builds.
# `1.0.0` satisfies both layers and is the conventional dev placeholder.
app.version=1.0.0
