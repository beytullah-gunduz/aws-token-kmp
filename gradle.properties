kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

#Android
android.useAndroidX=true
android.enableJetifier=false

# AGP 9+ refuses the classic com.android.library + kotlin-multiplatform combo
# by default. These two flags bypass the guard so we can keep using
# com.android.library (which Compose Multiplatform Resources supports cleanly,
# unlike com.android.kotlin.multiplatform.library).
android.builtInKotlin=false
android.newDsl=false

#MPP
kotlin.mpp.enableCInteropCommonization=true

# Local-dev placeholder for the app version. The release workflow overrides
# this with the git tag via `-Papp.version=<tag>`. Must be plain MAJOR.MINOR.PATCH
# — Compose Desktop validates `packageVersion` at configuration time and
# rejects suffixes for .msi / .dmg, which would break every Gradle invocation
# (including spotlessCheck) before any task even runs.
app.version=0.0.0
