name: Build and Test

# Per-push CI smoke test: lint, compile, run tests. Single Linux runner —
# packaging across macOS/Linux/Windows is exercised by .github/workflows/
# release.yml on every tag push, so there's no need to repeat it here per
# push. Running `packageRelease{Dmg,Msi,Deb}` on every push would burn
# ~6 min × 3 OS for no extra signal, and would also trip jpackage's runtime
# checks on the dev `app.version=1.0.0` placeholder (release.yml only
# succeeds because it overrides the version via -P from the tag).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Same rationale as release.yml: keep every `run:` on bash so PowerShell
# argument splitting on dotted properties (`-Papp.version=1.0.0`) can never
# bite us, even if a step is later added that needs a -P flag.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21 matches `jvmToolchain(21)` in composeApp/build.gradle.kts.
      # If the toolchain ever bumps, change this here AND in release.yml.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # spotlessCheck first because it's the cheapest gate — failing fast on
      # a formatting issue saves the runner minutes of compile work that's
      # about to be discarded.
      - name: Verify formatting
        run: ./gradlew spotlessCheck

      # commonMain + desktopMain. This is the bulk of the codebase since
      # the desktop build is the primary target.
      - name: Compile desktop
        run: ./gradlew :composeApp:compileKotlinDesktop

      # commonMain + androidMain. The androidApp module reuses everything
      # in composeApp's android target, so this catches the same set of
      # KMP-level breakages that an `:androidApp:assembleDebug` would find,
      # without paying for a full APK assembly on every push.
      - name: Compile android
        run: ./gradlew :composeApp:compileDebugKotlinAndroid

      - name: Run tests
        run: ./gradlew :composeApp:desktopTest
